<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Green Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <!-- Apple Highlight Gradient -->
    <radialGradient id="appleHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Solar Sun Glow behind Apple -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Dark Base for App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Sun Glow behind Apple -->
  <circle cx="256" cy="270" r="180" fill="url(#sunGlow)"/>

  <!-- Stem -->
  <path d="M 256 160 Q 270 110 295 95 Q 285 92 268 115 Q 256 138 250 160 Z" fill="url(#stemGrad)" filter="url(#shadow)"/>

  <!-- Leaf -->
  <path d="M 260 145 C 290 100 350 110 365 140 C 330 165 280 165 260 145 Z" fill="url(#leafGrad)" filter="url(#shadow)"/>
  <path d="M 265 147 Q 310 135 355 138" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Green Apple Body -->
  <path d="M 256 165 
           C 215 140 140 160 130 230 
           C 118 310 160 415 220 425 
           C 245 430 252 418 256 418 
           C 260 418 267 430 292 425 
           C 352 415 394 310 382 230 
           C 372 160 297 140 256 165 Z" 
        fill="url(#appleGrad)" 
        filter="url(#shadow)"/>

  <!-- Apple Highlight Overlay -->
  <path d="M 256 165 
           C 215 140 140 160 130 230 
           C 118 310 160 415 220 425 
           C 245 430 252 418 256 418 
           C 260 418 267 430 292 425 
           C 352 415 394 310 382 230 
           C 372 160 297 140 256 165 Z" 
        fill="url(#appleHighlight)" 
        opacity="0.7"/>

  <!-- Apple Top Indentation Line -->
  <path d="M 235 170 Q 256 185 277 170" stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>