<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>

    <!-- Solar Corona Glow -->
    <radialGradient id="solarGlow" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Green Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <radialGradient id="appleHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Solar Glow Circles -->
  <circle cx="320" cy="315" r="320" fill="url(#solarGlow)"/>

  <!-- Subtle Sun Rays -->
  <g opacity="0.15" stroke="#fbbf24" stroke-linecap="round" stroke-width="3">
    <circle cx="320" cy="315" r="260" stroke-dasharray="16 28" fill="none"/>
    <circle cx="320" cy="315" r="290" stroke-dasharray="24 36" fill="none"/>
  </g>

  <!-- Left Side Emblem (Green Apple Logo) -->
  <g transform="translate(140, 115) scale(0.78)" filter="url(#shadow)">
    <!-- Stem -->
    <path d="M 256 160 Q 270 110 295 95 Q 285 92 268 115 Q 256 138 250 160 Z" fill="url(#stemGrad)"/>
    <!-- Leaf -->
    <path d="M 260 145 C 290 100 350 110 365 140 C 330 165 280 165 260 145 Z" fill="url(#leafGrad)"/>
    <path d="M 265 147 Q 310 135 355 138" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Green Apple Body -->
    <path d="M 256 165 C 215 140 140 160 130 230 C 118 310 160 415 220 425 C 245 430 252 418 256 418 C 260 418 267 430 292 425 C 352 415 394 310 382 230 C 372 160 297 140 256 165 Z" fill="url(#appleGrad)"/>
    <path d="M 256 165 C 215 140 140 160 130 230 C 118 310 160 415 220 425 C 245 430 252 418 256 418 C 260 418 267 430 292 425 C 352 415 394 310 382 230 C 372 160 297 140 256 165 Z" fill="url(#appleHighlight)" opacity="0.7"/>
    <path d="M 235 170 Q 256 185 277 170" stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right Side Typography & Content -->
  <g transform="translate(560, 0)">
    <!-- App Badge -->
    <g transform="translate(0, 130)">
      <rect width="280" height="38" rx="19" fill="#7c2d12" opacity="0.8"/>
      <rect width="280" height="38" rx="19" fill="none" stroke="#ea580c" stroke-width="1.5"/>
      <text x="140" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fdba74" text-anchor="middle">☀️ CIRCADIAN DIET SYSTEM</text>
    </g>

    <!-- Main App Title -->
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Solar<tspan fill="url(#textGrad)">Nutrition</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">
      Ernährung nach wahrer Sonnenzeit &amp; 3 Wachstumszonen
    </text>

    <!-- Feature Cards / Badges Grid -->
    <g transform="translate(0, 335)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🌳 3 Wachstumszonen</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Baum • Strauch • Erdwurzel</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(265, 0)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">☀️ Wahre Sonnenzeit</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Live Rechner für jeden Ort</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(0, 68)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🍲 676+ Solar Rezepte</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Mit Kombinations-Checker</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(265, 68)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🌐 20 Sprachen &amp; PWA</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Installierbar als Offline-App</text>
      </g>
    </g>
  </g>
</svg>