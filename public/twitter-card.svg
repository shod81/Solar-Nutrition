<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="twBgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Solar Corona Glow -->
    <radialGradient id="twSolarGlow" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Green Apple Gradient -->
    <radialGradient id="twAppleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <radialGradient id="twAppleHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="twLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="twStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="twTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="twShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="628" fill="url(#twBgGrad)"/>

  <!-- Decorative Glow Circles -->
  <circle cx="300" cy="314" r="340" fill="url(#twSolarGlow)"/>

  <!-- Sun Rays -->
  <g opacity="0.18" stroke="#fbbf24" stroke-linecap="round" stroke-width="3">
    <circle cx="300" cy="314" r="250" stroke-dasharray="18 30" fill="none"/>
    <circle cx="300" cy="314" r="285" stroke-dasharray="26 38" fill="none"/>
  </g>

  <!-- Left Side Green Apple Emblem -->
  <g transform="translate(120, 110) scale(0.8)" filter="url(#twShadow)">
    <path d="M 256 160 Q 270 110 295 95 Q 285 92 268 115 Q 256 138 250 160 Z" fill="url(#twStemGrad)"/>
    <path d="M 260 145 C 290 100 350 110 365 140 C 330 165 280 165 260 145 Z" fill="url(#twLeafGrad)"/>
    <path d="M 265 147 Q 310 135 355 138" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <path d="M 256 165 C 215 140 140 160 130 230 C 118 310 160 415 220 425 C 245 430 252 418 256 418 C 260 418 267 430 292 425 C 352 415 394 310 382 230 C 372 160 297 140 256 165 Z" fill="url(#twAppleGrad)"/>
    <path d="M 256 165 C 215 140 140 160 130 230 C 118 310 160 415 220 425 C 245 430 252 418 256 418 C 260 418 267 430 292 425 C 352 415 394 310 382 230 C 372 160 297 140 256 165 Z" fill="url(#twAppleHighlight)" opacity="0.75"/>
    <path d="M 235 170 Q 256 185 277 170" stroke="#15803d" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right Side Content -->
  <g transform="translate(550, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 125)">
      <rect width="310" height="40" rx="20" fill="#7c2d12" opacity="0.85"/>
      <rect width="310" height="40" rx="20" fill="none" stroke="#f97316" stroke-width="1.5"/>
      <text x="155" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fed7aa" text-anchor="middle">☀️ CIRCADIAN SOLAR DIET</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Solar<tspan fill="url(#twTextGrad)">Nutrition</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">
      Circadian Diet • 3 Growth Zones • True Solar Time
    </text>

    <!-- Feature Pill Badges Grid -->
    <g transform="translate(0, 335)">
      <g transform="translate(0, 0)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🌳 3 Growth Zones</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Tree • Vine/Grain • Root/Fungi</text>
      </g>

      <g transform="translate(265, 0)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">☀️ True Solar Time</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Live Solar Clock &amp; GPS</text>
      </g>

      <g transform="translate(0, 68)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🍲 676+ Solar Recipes</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Meal Combination Checker</text>
      </g>

      <g transform="translate(265, 68)">
        <rect width="250" height="54" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">🌐 20 Languages PWA</text>
        <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Offline Installable App</text>
      </g>
    </g>
  </g>
</svg>
